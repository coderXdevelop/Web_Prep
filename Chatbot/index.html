<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot Demo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="chat-wrapper">

</body>

</html>
